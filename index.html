<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Page-specific SEO tags (title, description, canonical, robots,
      Open Graph, Twitter) are set by each page component in React
      (see src/components/common/Seo.tsx). Do not add them here,
      or every page will get duplicate or wrong tags.
    -->
    <meta name="theme-color" content="#234737" />
    <meta property="og:locale" content="en_IN" />

    <!-- Performance: Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 15 C30 35 25 60 50 85 C75 60 70 35 50 15 Z' fill='%23234737'/><path d='M50 25 C50 50 50 75 50 75' stroke='%23F8F5EF' stroke-width='3' stroke-linecap='round'/></svg>"
    />
  </head>

  <body
    class="bg-[#F8F5EF] text-[#252A24] font-sans antialiased selection:bg-[#234737] selection:text-[#F8F5EF]"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
